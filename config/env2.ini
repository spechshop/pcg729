;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; static-php-cli (spc) env configuration
;
; This file is used to set default env vars for static-php-cli build.
; As dynamic build process, some of these vars can be overwritten by CLI options.
; And you can also overwrite these vars by setting them in your shell environment.
;
; We need to use some pre-defined internal env vars, like `BUILD_ROOT_PATH`,
; `DOWNLOAD_PATH`, etc.
;
; Please note that these vars cannot be defined in this file, they are only
; defined before static-php-cli running.
;
; Here's a list of env vars, these values cannot be changed anywhere:
;
;   WORKING_DIR:        the working directory of the build process
;   ROOT_DIR:           the root directory of static-php-cli
;   BUILD_ROOT_PATH:    the root path of the build process
;   BUILD_INCLUDE_PATH: the path of the include files
;   BUILD_LIB_PATH:     the path of the lib files
;   BUILD_BIN_PATH:     the path of the bin files
;   PKG_ROOT_PATH:      the root path of the package files
;   SOURCE_PATH:        the path of the source files
;   DOWNLOAD_PATH:      the path of the download files
;   CPU_COUNT:          the count of CPU cores
;   SPC_ARCH:           target architecture
;   GNU_ARCH:           GNU architecture
;   MAC_ARCH:           macOS architecture


[global]

; Build concurrency for make -jN.
SPC_CONCURRENCY=${CPU_COUNT}

; Ignore PHP version check before building some extensions.
SPC_SKIP_PHP_VERSION_CHECK="no"

; Ignore doctor check items, comma separated.
SPC_SKIP_DOCTOR_CHECK_ITEMS=""

; Extension directory for non-pure-static builds.
EXTENSION_DIR=


[windows]

PHP_SDK_PATH="${WORKING_DIR}\php-sdk-binary-tools"
UPX_EXEC="${PKG_ROOT_PATH}\bin\upx.exe"

SPC_MICRO_PATCHES=static_extensions_win32,cli_checks,disable_huge_page,vcruntime140,win32,zend_stream,cli_static

[linux]

SPC_LIBC=glibc

CC=gcc
CXX=g++
AR=ar
LD=ld

SPC_DEFAULT_C_FLAGS="-fPIC"
SPC_DEFAULT_CXX_FLAGS=

SPC_EXTRA_LIBS=

UPX_EXEC=${PKG_ROOT_PATH}/bin/upx

SPC_MICRO_PATCHES=static_extensions_win32,cli_checks,disable_huge_page,vcruntime140,win32,zend_stream

SPC_CMD_PREFIX_PHP_BUILDCONF="./buildconf --force"

SPC_CMD_PREFIX_PHP_CONFIGURE="./configure --prefix= --with-valgrind=no --enable-shared=no --enable-static=yes --disable-all --disable-cgi --disable-phpdbg --with-pic"

SPC_CMD_PREFIX_PHP_MAKE="make -j${CPU_COUNT}"

SPC_CMD_VAR_PHP_EMBED_TYPE="static"

SPC_CMD_VAR_PHP_CONFIGURE_CFLAGS="-g -O2 -fstack-protector-strong -fPIE -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64"

SPC_CMD_VAR_PHP_CONFIGURE_CPPFLAGS="-I${BUILD_INCLUDE_PATH}"

SPC_CMD_VAR_PHP_CONFIGURE_LDFLAGS="-L${BUILD_LIB_PATH}"

SPC_CMD_VAR_PHP_CONFIGURE_LIBS="-ldl -lpthread -lm -lresolv -lutil -lrt"

SPC_CMD_VAR_PHP_MAKE_EXTRA_CFLAGS="-fno-ident"

SPC_CMD_VAR_PHP_MAKE_EXTRA_LIBS="-ldl -lpthread -lm -lresolv -lutil -lrt"

SPC_CMD_VAR_PHP_MAKE_EXTRA_LDFLAGS_PROGRAM="-Wl,-O1 -pie"

[macos]

CC=clang
CXX=clang++

SPC_DEFAULT_C_FLAGS="--target=${MAC_ARCH}-apple-darwin"
SPC_DEFAULT_CXX_FLAGS="--target=${MAC_ARCH}-apple-darwin"

SPC_EXTRA_LIBS=

SPC_MICRO_PATCHES=static_extensions_win32,cli_checks,disable_huge_page,vcruntime140,win32,zend_stream,macos_iconv


; ----------------------------------------------------------------------
; PHP build commands
; ----------------------------------------------------------------------

SPC_CMD_PREFIX_PHP_BUILDCONF="./buildconf --force"

SPC_CMD_PREFIX_PHP_CONFIGURE="./configure --prefix= --with-valgrind=no --enable-shared=no --enable-static=yes --enable-bcg729 --disable-all --disable-cgi --disable-phpdbg"

SPC_CMD_PREFIX_PHP_MAKE="make -j${CPU_COUNT}"


; ----------------------------------------------------------------------
; PHP build variables
; ----------------------------------------------------------------------

SPC_CMD_VAR_PHP_CONFIGURE_CFLAGS="${SPC_DEFAULT_C_FLAGS} -Werror=unknown-warning-option"

SPC_CMD_VAR_PHP_CONFIGURE_CPPFLAGS="-I${BUILD_INCLUDE_PATH}"

SPC_CMD_VAR_PHP_CONFIGURE_LDFLAGS="-L${BUILD_LIB_PATH}"

SPC_CMD_VAR_PHP_MAKE_EXTRA_CFLAGS="${SPC_PHP_DEFAULT_OPTIMIZE_CFLAGS}"

SPC_CMD_VAR_PHP_MAKE_EXTRA_LIBS="-lresolv"

SPC_CMD_VAR_PHP_EMBED_TYPE="static"


[freebsd]

CC=clang
CXX=clang++